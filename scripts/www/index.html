<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期货交易盈亏比计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .container> :last-child {
            margin-bottom: 0;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .search-select {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-input::placeholder {
            color: #999;
        }

        .select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background: white;
            border: 2px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
            display: none;
        }

        .select-dropdown.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-item:hover {
            background: #f5f5f5;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item .code {
            font-weight: 600;
            color: #667eea;
        }

        .dropdown-item .name {
            color: #666;
        }

        .input-row {
            display: flex;
            gap: 15px;
        }

        .input-row .form-group {
            flex: 1;
        }

        .price-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .price-input:focus {
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .result-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .validation-message {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #856404;
            font-weight: 500;
        }

        .validation-icon {
            font-size: 18px;
        }

        .validation-text {
            font-size: 14px;
        }

        .profit-ratio-box {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            padding: 20px;
        }

        .ratio-section {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .ratio-section.full {
            flex: 0 0 100%;
        }

        .ratio-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .ratio-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .ratio-value.green {
            color: #ffc107;
        }

        .ratio-value.red {
            color: #dc3545;
        }

        .ratio-value.blue {
            color: #28a745;
        }

        .ratio-tip {
            font-size: 12px;
            color: #999;
        }

        .result-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .result-table th,
        .result-table td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }

        .result-table tr:hover {
            background: #f9f9f9;
        }

        .result-table tr {
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .result-table tr.clicked {
            background-color: #c3e6cb !important;
        }

        .result-table .profit {
            color: #dc3545;
            font-weight: 600;
        }

        .result-table .risk {
            color: #28a745;
            font-weight: 600;
        }

        .contract-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-label {
            color: #999;
            font-size: 13px;
            font-weight: 500;
            min-width: 80px;
            text-align: right;
        }

        .info-value {
            font-weight: 700;
            color: #1a1a1a;
            flex: 1;
            text-align: left;
        }

        @media (max-width: 1024px) {

            .card,
            .result-section {
                padding: 24px;
            }

            h1 {
                font-size: 24px;
            }

            .contract-info {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .card,
            .result-section {
                padding: 20px;
                margin-bottom: 12px;
            }

            .input-row {
                flex-direction: column;
                gap: 0;
            }

            .input-row .form-group {
                width: 100%;
            }

            .search-input,
            .price-input {
                padding: 11px 14px;
                font-size: 15px;
            }

            .profit-ratio-box {
                flex-wrap: wrap;
                padding: 15px;
                gap: 10px;
                margin-bottom: 12px;
            }

            .ratio-section {
                flex: 1;
                min-width: 140px;
                padding: 12px;
            }

            .ratio-value {
                font-size: 28px;
            }

            .ratio-label {
                font-size: 12px;
            }

            .contract-info {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                padding: 15px;
                gap: 10px;
            }

            .info-item {
                flex-direction: column;
                gap: 4px;
            }

            .info-label {
                min-width: auto;
                text-align: left;
                font-size: 12px;
            }

            .info-value {
                text-align: left;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            h1 {
                font-size: 18px;
                margin-bottom: 10px;
            }

            .card,
            .result-section {
                padding: 12px;
                margin-bottom: 8px;
                border-radius: 12px;
            }

            .form-group {
                margin-bottom: 10px;
            }

            label {
                font-size: 13px;
                margin-bottom: 4px;
            }

            .search-input,
            .price-input {
                padding: 8px 10px;
                font-size: 14px;
                border-radius: 8px;
            }

            .calculate-btn {
                padding: 12px;
                font-size: 16px;
                border-radius: 8px;
            }

            .profit-ratio-box {
                padding: 12px;
                gap: 8px;
                border-radius: 8px;
                margin-bottom: 8px;
            }

            .ratio-section {
                flex: 1;
                min-width: calc(50% - 4px);
                padding: 10px 8px;
                border-radius: 6px;
            }

            .ratio-value {
                font-size: 24px;
            }

            .ratio-label {
                font-size: 11px;
            }

            .ratio-tip {
                font-size: 10px;
            }

            .contract-info {
                grid-template-columns: repeat(2, 1fr);
                padding: 12px;
                gap: 8px;
                border-radius: 8px;
            }

            .info-item {
                flex-direction: column;
                gap: 3px;
            }

            .info-label {
                font-size: 11px;
            }

            .info-value {
                font-size: 13px;
            }

            .dropdown-item {
                padding: 10px 12px;
                font-size: 14px;
            }

            .dropdown-item .code {
                font-size: 14px;
            }

            .dropdown-item .name {
                font-size: 13px;
            }

            .result-table-wrapper {
                overflow-x: auto;
            }

            .result-table {
                min-width: 400px;
            }

            .result-table th,
            .result-table td {
                padding: 8px 10px;
                font-size: 13px;
                white-space: nowrap;
            }
        }

        @media (min-width: 769px) {
            .result-table-wrapper {
                overflow-x: visible;
            }

            .result-table {
                min-width: auto;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="form-group">
                <label>资金总量</label>
                <input type="number" class="price-input" id="totalCapital" placeholder="输入总资金" step="any">
            </div>
            <div class="form-group">
                <label>选择期货合约</label>
                <div class="search-select">
                    <input type="text" class="search-input" id="contractSearch" placeholder="搜索合约代码或名称..."
                        autocomplete="off">
                    <div class="select-dropdown" id="contractDropdown"></div>
                    <input type="hidden" id="selectedContract">
                </div>
            </div>

            <div class="input-row">
                <div class="form-group">
                    <label>开仓价格</label>
                    <input type="number" class="price-input" id="entryPrice" placeholder="输入开仓价格" step="any">
                </div>
                <div class="form-group">
                    <label>止损价格</label>
                    <input type="number" class="price-input" id="stopLossPrice" placeholder="输入止损价格" step="any">
                </div>
                <div class="form-group">
                    <label>止盈价格</label>
                    <input type="number" class="price-input" id="takeProfitPrice" placeholder="输入止盈价格" step="any">
                </div>
            </div>

        </div>

        <div id="validationMessage" class="validation-message" style="display: none;">
            <span class="validation-icon">⚠</span>
            <span class="validation-text">止盈和止损价格不合法，请检查输入</span>
        </div>

        <div class="result-section" id="resultSection" style="display: none;">
            <div class="profit-ratio-box">
                <div class="ratio-section">
                    <div class="ratio-label">开仓方向</div>
                    <div class="ratio-value" id="directionDisplay">--</div>
                </div>
                <div class="ratio-section">
                    <div class="ratio-label">盈亏比</div>
                    <div class="ratio-value" id="profitRatio">-</div>
                </div>
                <div class="ratio-section full">
                    <div class="ratio-label">最差止盈价</div>
                    <div class="ratio-value green" id="worstTakeProfit">-</div>
                </div>
                <div class="ratio-section">
                    <div class="ratio-label">盈利比例</div>
                    <div class="ratio-value red" id="profitPercentage">-</div>
                </div>
                <div class="ratio-section">
                    <div class="ratio-label">亏损比例</div>
                    <div class="ratio-value blue" id="lossPercentage">-</div>
                </div>
                <div class="ratio-section">
                    <div class="ratio-label">风险/保证金</div>
                    <div class="ratio-value blue" id="riskMarginRatio">-</div>
                </div>
                <div class="ratio-section">
                    <div class="ratio-label">收益/保证金</div>
                    <div class="ratio-value red" id="profitMarginRatio">-</div>
                </div>
            </div>

            <div class="result-table-wrapper">
                <table class="result-table">
                    <thead>
                        <tr>
                            <th>手数</th>
                            <th>风险</th>
                            <th>收益</th>
                            <th>风险占比</th>
                            <th>仓位占比</th>
                            <th>手续费</th>
                            <th>保证金</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="result-section" id="contractInfoSection" style="display: none;">
            <div class="contract-info" id="contractInfo">
                <div class="info-item">
                    <span class="info-label">合约名称</span>
                    <span class="info-value" id="infoName">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">每跳价格</span>
                    <span class="info-value" id="infoTick">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">合约乘数</span>
                    <span class="info-value" id="infoMultiplier">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">保证金率</span>
                    <span class="info-value" id="infoMargin">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">手续费方式</span>
                    <span class="info-value" id="infoFeeType">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">手续费</span>
                    <span class="info-value" id="infoFee">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let futuresContracts = [];
        let currentContract = null;
        let copyData = null;

        document.addEventListener('DOMContentLoaded', () => {
            const savedCapital = localStorage.getItem('totalCapital');
            if (savedCapital !== null && savedCapital !== '') {
                document.getElementById('totalCapital').value = savedCapital;
            }
            fetchContracts();
        });

        async function fetchContracts() {
            const apiUrl = 'http://dict.openctp.cn/instruments?types=futures';
            try {
                const productNameMap = await fetchProductNameMap();
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (data.rsp_code === 0 && data.data && data.data.length > 0) {
                    futuresContracts = data.data
                        .filter(item => item.InstLifePhase === '1')
                        .map(item => {
                            // 合约代码数字部分仅 3 位时（如 cf701），依据交割年份补全十位数字（2027 -> 2 -> cf2701）
                            let code = item.InstrumentID;
                            const digitMatch = code.match(/(\d+)$/);
                            if (digitMatch && digitMatch[1].length === 3 && item.DeliveryYear) {
                                const decade = Math.floor((Number(item.DeliveryYear) % 100) / 10);
                                code = code.slice(0, digitMatch.index) + decade + digitMatch[1];
                            }
                            // 名称优先取产品中文名 + 时间，如 CF2701 -> 一号棉花2701
                            const prefixMatch = code.match(/^[A-Za-z_]+/);
                            const prefix = prefixMatch ? prefixMatch[0].toUpperCase() : '';
                            const suffixMatch = code.match(/\d+$/);
                            const suffix = suffixMatch ? suffixMatch[0] : '';
                            const productName = productNameMap[prefix];
                            const name = productName ? productName + suffix : item.InstrumentName;
                            const ratioFee = item.OpenRatioByMoney && item.OpenRatioByMoney >= 0.00001 ? item.OpenRatioByMoney : 0;
                            let fixedFee = item.OpenRatioByVolume || 0;
                            if (fixedFee > 0.01) {
                                fixedFee -= 0.01;
                            } else if (fixedFee === 0.01) {
                                fixedFee = 0;
                            }
                            return {
                                code: code,
                                name: name,
                                tick: item.PriceTick,
                                multiplier: item.VolumeMultiple,
                                marginRate: item.LongMarginRatioByMoney || item.ShortMarginRatioByMoney || 0.1,
                                feeType: ratioFee > 0 && fixedFee > 0 ? 'both' : ratioFee > 0 ? 'rate' : 'fixed',
                                feeValue: ratioFee > 0 ? ratioFee : fixedFee,
                                ratioFee: ratioFee,
                                fixedFee: fixedFee
                            };
                        });
                }
            } catch (e) {
                console.log('API获取合约数据失败');
            }
            initSearchSelect();
            initAutoCalculate();
            fetchLivePrices();
        }

        async function fetchProductNameMap() {
            const map = {};
            try {
                const response = await fetch('http://dict.openctp.cn/products?types=futures');
                const data = await response.json();
                if (data.rsp_code === 0 && data.data && data.data.length > 0) {
                    data.data.forEach(p => {
                        if (p.ProductID != null) {
                            map[String(p.ProductID).toUpperCase()] = p.ProductName;
                        }
                    });
                }
            } catch (e) {
                console.log('获取产品中文名失败');
            }
            return map;
        }

        async function fetchLivePrices() {
            const apiUrl = 'https://api.tenapi.cn/futures/';
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                if (data.code === 200 && data.data && data.data.length > 0) {
                    const priceMap = {};
                    data.data.forEach(item => {
                        if (item.code && item.price) {
                            priceMap[item.code] = parseFloat(item.price);
                        }
                    });
                    futuresContracts.forEach(c => {
                        if (priceMap[c.code]) {
                            c.currentPrice = priceMap[c.code];
                        }
                    });
                }
            } catch (e) {
                console.log('使用本地默认数据');
            }
        }

        function renderDropdown(filter = '') {
            const dropdown = document.getElementById('contractDropdown');
            dropdown.innerHTML = '';
            const filtered = futuresContracts.filter(c =>
                c.code.toLowerCase().includes(filter.toLowerCase()) ||
                c.name.includes(filter)
            );

            if (filtered.length === 0) {
                const noResult = document.createElement('div');
                noResult.className = 'dropdown-item';
                noResult.textContent = '未找到匹配的合约';
                dropdown.appendChild(noResult);
                return;
            }

            filtered.forEach(contract => {
                const item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerHTML = `
                    <span class="code">${contract.code}</span>
                    <span class="name">${contract.name}</span>
                `;
                item.addEventListener('click', () => {
                    selectContract(contract);
                    dropdown.classList.remove('show');
                });
                dropdown.appendChild(item);
            });
        }

        function initSearchSelect() {
            const searchInput = document.getElementById('contractSearch');
            const dropdown = document.getElementById('contractDropdown');

            searchInput.addEventListener('input', (e) => {
                renderDropdown(e.target.value);
                dropdown.classList.add('show');
            });

            searchInput.addEventListener('focus', () => {
                if (currentContract) {
                    currentContract = null;
                    searchInput.value = '';
                    document.getElementById('selectedContract').value = '';
                    document.getElementById('contractInfoSection').style.display = 'none';
                    document.getElementById('resultSection').style.display = 'none';
                    document.getElementById('validationMessage').style.display = 'none';
                }
                renderDropdown(searchInput.value);
                dropdown.classList.add('show');
            });

            document.addEventListener('click', (e) => {
                if (!searchInput.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.remove('show');
                }
            });

            renderDropdown();
        }

        function selectContract(contract) {
            currentContract = contract;
            document.getElementById('contractSearch').value = `${contract.code} - ${contract.name}`;
            document.getElementById('selectedContract').value = contract.code;

            document.getElementById('entryPrice').value = '';
            document.getElementById('stopLossPrice').value = '';
            document.getElementById('takeProfitPrice').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('validationMessage').style.display = 'none';

            document.getElementById('contractInfoSection').style.display = 'block';
            document.getElementById('infoName').textContent = contract.name;
            document.getElementById('infoTick').textContent = contract.tick;
            document.getElementById('infoMultiplier').textContent = contract.multiplier;
            document.getElementById('infoMargin').textContent = (contract.marginRate * 100).toFixed(1) + '%';
            let feeTypeText = '';
            let feeText = '';
            if (contract.feeType === 'both') {
                feeTypeText = '比例+固定';
                feeText = `${(contract.ratioFee * 10000).toFixed(4)}万分之一 + ${contract.fixedFee.toFixed(2)}元/手`;
            } else if (contract.feeType === 'fixed') {
                feeTypeText = '固定金额';
                feeText = `${contract.fixedFee.toFixed(2)}元/手`;
            } else {
                feeTypeText = '按比例';
                feeText = `${(contract.ratioFee * 10000).toFixed(4)}万分之一`;
            }
            document.getElementById('infoFeeType').textContent = feeTypeText;
            document.getElementById('infoFee').textContent = feeText;
        }

        function initAutoCalculate() {
            const entryPrice = document.getElementById('entryPrice');
            const stopLossPrice = document.getElementById('stopLossPrice');
            const takeProfitPrice = document.getElementById('takeProfitPrice');

            entryPrice.addEventListener('input', calculate);
            stopLossPrice.addEventListener('input', calculate);
            takeProfitPrice.addEventListener('input', calculate);

            const totalCapital = document.getElementById('totalCapital');
            totalCapital.addEventListener('input', () => {
                localStorage.setItem('totalCapital', totalCapital.value);
                calculate();
            });
        }

        function calculate() {
            const validationMessage = document.getElementById('validationMessage');
            const resultSection = document.getElementById('resultSection');

            if (!currentContract) {
                resultSection.style.display = 'none';
                validationMessage.style.display = 'none';
                return;
            }

            const entryPrice = parseFloat(document.getElementById('entryPrice').value);
            const stopLossPrice = parseFloat(document.getElementById('stopLossPrice').value);
            const takeProfitPrice = parseFloat(document.getElementById('takeProfitPrice').value);
            const totalCapital = parseFloat(document.getElementById('totalCapital').value);

            if (isNaN(entryPrice) || isNaN(stopLossPrice) || isNaN(takeProfitPrice) || isNaN(totalCapital) || totalCapital <= 0) {
                resultSection.style.display = 'none';
                validationMessage.style.display = 'none';
                return;
            }

            let direction = '';
            if (takeProfitPrice > entryPrice && stopLossPrice < entryPrice) {
                direction = 'long';
            } else if (takeProfitPrice < entryPrice && stopLossPrice > entryPrice) {
                direction = 'short';
            }

            if (!direction) {
                resultSection.style.display = 'none';
                validationMessage.style.display = 'flex';
                return;
            }

            validationMessage.style.display = 'none';

            const { multiplier, marginRate, feeType, feeValue } = currentContract;

            let riskPerLot = 0;
            let profitPerLot = 0;

            if (direction === 'long') {
                riskPerLot = (entryPrice - stopLossPrice) * multiplier;
                profitPerLot = (takeProfitPrice - entryPrice) * multiplier;
            } else {
                riskPerLot = (stopLossPrice - entryPrice) * multiplier;
                profitPerLot = (entryPrice - takeProfitPrice) * multiplier;
            }

            let feePerLot = 0;
            const rateFeeAmount = entryPrice * multiplier * (currentContract.ratioFee || 0);
            const fixedFeeAmount = currentContract.fixedFee || 0;
            feePerLot = (rateFeeAmount + fixedFeeAmount) * 2;

            const netProfitPerLot = profitPerLot - feePerLot;
            const netRiskPerLot = riskPerLot + feePerLot;
            const profitRatio = riskPerLot > 0 ? (netProfitPerLot / netRiskPerLot) : 0;

            const profitPercentage = entryPrice > 0 ? ((takeProfitPrice - entryPrice) / entryPrice * 100) : 0;
            const lossPercentage = entryPrice > 0 ? ((stopLossPrice - entryPrice) / entryPrice * 100) : 0;

            document.getElementById('resultSection').style.display = 'block';

            const directionDisplay = document.getElementById('directionDisplay');
            directionDisplay.textContent = direction === 'long' ? '多头' : '空头';
            directionDisplay.className = direction === 'long' ? 'ratio-value red' : 'ratio-value blue';

            const ratioElement = document.getElementById('profitRatio');
            ratioElement.textContent = profitRatio.toFixed(2);
            ratioElement.className = 'ratio-value green';

            const profitPercentElement = document.getElementById('profitPercentage');
            profitPercentElement.textContent = profitPercentage.toFixed(2) + '%';

            const lossPercentElement = document.getElementById('lossPercentage');
            lossPercentElement.textContent = lossPercentage.toFixed(2) + '%';

            const marginPerLot = entryPrice * multiplier * marginRate;
            const riskMarginRatio = marginPerLot > 0 ? (netRiskPerLot / marginPerLot * 100) : 0;
            const profitMarginRatio = marginPerLot > 0 ? (netProfitPerLot / marginPerLot * 100) : 0;

            const riskMarginElement = document.getElementById('riskMarginRatio');
            riskMarginElement.textContent = riskMarginRatio.toFixed(2) + '%';

            const profitMarginElement = document.getElementById('profitMarginRatio');
            profitMarginElement.textContent = profitMarginRatio.toFixed(2) + '%';

            // 最差止盈价：止损与开仓价不变，盈亏比为 1.5 时的止盈价
            const targetProfitPerLot = 1.5 * riskPerLot + 2.5 * feePerLot;
            let worstTakeProfitPrice = direction === 'long'
                ? entryPrice + targetProfitPerLot / multiplier
                : entryPrice - targetProfitPerLot / multiplier;
            if (currentContract.tick && currentContract.tick > 0) {
                worstTakeProfitPrice = Math.round(worstTakeProfitPrice / currentContract.tick) * currentContract.tick;
            }
            const tickStr = String(currentContract.tick || 0);
            const tickDecimals = tickStr.includes('.') ? tickStr.split('.')[1].length : 0;

            const worstTakeProfitElement = document.getElementById('worstTakeProfit');
            worstTakeProfitElement.textContent = worstTakeProfitPrice.toFixed(tickDecimals);

            copyData = {
                code: currentContract.code,
                entryPrice: entryPrice.toFixed(tickDecimals),
                stopLossPrice: stopLossPrice.toFixed(tickDecimals),
                takeProfitPrice: takeProfitPrice.toFixed(tickDecimals),
                profitRatio: profitRatio.toFixed(2),
                worstTakeProfitPrice: worstTakeProfitPrice.toFixed(tickDecimals)
            };

            const tableBody = document.getElementById('resultTableBody');
            tableBody.innerHTML = '';

            // 列表条数：恰好到仓位占比不超过 100% 且风险不超过总资金 2% 的那一行为止
            let maxLotsToShow = marginPerLot > 0 ? Math.ceil(totalCapital / marginPerLot) : 0;
            if (netRiskPerLot > 0) {
                maxLotsToShow = Math.min(maxLotsToShow, Math.ceil(totalCapital * 0.02 / netRiskPerLot));
            }

            for (let lots = 1; lots <= maxLotsToShow; lots++) {
                const risk = netRiskPerLot * lots;
                const profit = netProfitPerLot * lots;
                const margin = entryPrice * multiplier * marginRate * lots;
                const fee = feePerLot * lots;
                const positionRatio = margin / totalCapital * 100;
                const riskPercent = risk / totalCapital * 100;
                if (positionRatio > 100 || riskPercent > 2) break;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${lots}</td>
                    <td class="risk">¥${risk.toFixed(2)}</td>
                    <td class="profit">¥${profit.toFixed(2)}</td>
                    <td>${riskPercent.toFixed(2)}%</td>
                    <td>${positionRatio.toFixed(2)}%</td>
                    <td>¥${fee.toFixed(2)}</td>
                    <td>¥${margin.toFixed(2)}</td>
                `;
                row.addEventListener('click', () => {
                    copyTradePlan(lots, positionRatio.toFixed(2) + '%');
                    row.classList.add('clicked');
                    setTimeout(() => row.classList.remove('clicked'), 600);
                });
                tableBody.appendChild(row);
            }
        }

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        function formatDateTime(date) {
            return `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())} ` +
                `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
        }

        async function copyTradePlan(lots, positionRatio) {
            if (!copyData) return;

            const text = [
                '---',
                `合约: ${copyData.code}`,
                `开仓时间: ${formatDateTime(new Date())}`,
                `开仓价: ${copyData.entryPrice}`,
                `止损价: ${copyData.stopLossPrice}`,
                `止盈价: ${copyData.takeProfitPrice}`,
                `预计盈亏比: ${copyData.profitRatio}`,
                `最差止盈价: ${copyData.worstTakeProfitPrice}`,
                `手数: ${lots}`,
                `仓位占比: ${positionRatio}`,
                '平仓时间: ',
                '平仓价: ',
                '收益: ',
                '---'
            ].join('\n');

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    fallbackCopy(text);
                }
            } catch (e) {
                fallbackCopy(text);
            }
        }
    </script>
</body>
